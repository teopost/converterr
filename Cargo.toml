[package]
name = "converterr"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Automatic media library transcoder with an *arr-style web UI"
repository = "https://github.com/teopost/converterr"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
